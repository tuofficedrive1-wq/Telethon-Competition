<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamiaat Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neon-shadow-gold { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4), inset 0 0 10px rgba(234, 179, 8, 0.1); }
        .neon-shadow-silver { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.1); }
        .neon-shadow-bronze { box-shadow: 0 0 15px rgba(249, 115, 22, 0.4), inset 0 0 10px rgba(249, 115, 22, 0.1); }
        .neon-shadow-default { box-shadow: 0 0 10px rgba(156, 163, 175, 0.2); }
        body { background: #0f172a; } /* Slate 900 */
    </style>
</head>
<body class="min-h-screen font-sans text-gray-200">

    <!-- SELECT RECORD SCREEN -->
    <div id="selection-screen" class="hidden flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-4xl font-black mb-8 text-white drop-shadow-md">Select Record to View Live</h1>
        <div id="comp-list" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl"></div>
    </div>

    <!-- MAIN LIVE CATEGORY DASHBOARD -->
    <div id="live-dashboard" class="hidden flex-col items-center min-h-screen p-4 md:p-10">
        
        <h1 id="dash-title" class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-400 mb-4 uppercase tracking-wide drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] text-center">
            Live Leaderboard
        </h1>
        <p class="text-xl md:text-2xl font-bold text-gray-400 mb-12 tracking-widest uppercase text-center">
            Jamiaat Rankings Category Wise
        </p>

        <!-- Categories Container -->
        <div id="categories-container" class="w-full max-w-7xl flex flex-col gap-16">
            <!-- Dynamic HTML will be injected here -->
        </div>

    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // ✅ APNA FIREBASE CONFIG YAHAN DAALEIN
    const firebaseConfig = {
        apiKey: "AIzaSyC87_ca7MsGB2WjOnr6dC-IYL78TYx0Oyg",
        authDomain: "telethon-28c88.firebaseapp.com",
        databaseURL: "https://telethon-28c88-default-rtdb.firebaseio.com",
        projectId: "telethon-28c88",
        storageBucket: "telethon-28c88.firebasestorage.app",
        messagingSenderId: "609452116316",
        appId: "1:609452116316:web:e940fc5dc4537b34551999"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const currentCompId = urlParams.get('id');

    function formatNum(num) {
        return Number(num).toLocaleString('en-IN');
    }

    if (!currentCompId) {
        document.getElementById('selection-screen').classList.remove('hidden');
        document.getElementById('selection-screen').classList.add('flex');
        
        onValue(ref(db, 'competitions'), (snapshot) => {
            const list = document.getElementById('comp-list');
            list.innerHTML = "";
            if (snapshot.exists()) {
                const comps = snapshot.val();
                for (let id in comps) {
                    list.innerHTML += `
                        <a href="?id=${id}" class="block bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 hover:border-emerald-500 transition transform hover:-translate-y-1">
                            <h2 class="text-2xl font-bold text-white">${comps[id].name}</h2>
                            <p class="text-gray-400 mt-2">Date: ${comps[id].date || 'N/A'}</p>
                            <div class="mt-4 text-emerald-400 font-bold flex items-center gap-2">Live Dekhein <span>&rarr;</span></div>
                        </a>
                    `;
                }
            } else {
                list.innerHTML = "<p class='text-gray-400'>No active records found.</p>";
            }
        });
    } else {
        document.getElementById('live-dashboard').classList.remove('hidden');
        document.getElementById('live-dashboard').classList.add('flex');

        onValue(ref(db, 'competitions/' + currentCompId), (snapshot) => {
            if (snapshot.exists()) {
                const comp = snapshot.val();
                if(comp.name) document.getElementById('dash-title').innerText = comp.name;

                if (comp.teams) {
                    // Sabhi Jamiaat ko array mein daal kar amount ke hisaab se descending order me sort karna
                    let jamiaatArray = Object.keys(comp.teams).map(k => comp.teams[k]);
                    jamiaatArray.sort((a, b) => (Number(b.amount) || 0) - (Number(a.amount) || 0));

                    const container = document.getElementById('categories-container');
                    container.innerHTML = ""; // Clear purana data

                    // Category setup
                    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                    
                    // 10-10 ke chunks (hisse) banana
                    for (let i = 0; i < jamiaatArray.length; i += 10) {
                        let chunk = jamiaatArray.slice(i, i + 10);
                        let catIndex = i / 10;
                        let catLetter = alphabet[catIndex] || `Ext-${catIndex}`;
                        
                        // Themes aur colors har category ke liye alag
                        let titleColor, borderColor, shadowClass, numberColor;

                        if (catIndex === 0) { // Category A (Rank 1-10)
                            titleColor = "from-yellow-300 via-yellow-500 to-yellow-600";
                            borderColor = "border-yellow-500/50";
                            shadowClass = "neon-shadow-gold";
                            numberColor = "text-yellow-400";
                        } else if (catIndex === 1) { // Category B (Rank 11-20)
                            titleColor = "from-sky-300 via-sky-400 to-blue-500";
                            borderColor = "border-sky-400/50";
                            shadowClass = "neon-shadow-silver";
                            numberColor = "text-sky-400";
                        } else if (catIndex === 2) { // Category C (Rank 21-30)
                            titleColor = "from-orange-400 via-orange-500 to-red-500";
                            borderColor = "border-orange-500/50";
                            shadowClass = "neon-shadow-bronze";
                            numberColor = "text-orange-400";
                        } else { // Category D, E, F etc..
                            titleColor = "from-purple-400 to-indigo-500";
                            borderColor = "border-indigo-500/30";
                            shadowClass = "neon-shadow-default";
                            numberColor = "text-indigo-400";
                        }

                        // Category Header Generate karna
                        let html = `
                        <div class="w-full">
                            <div class="flex items-center justify-center gap-4 mb-6">
                                <div class="h-[2px] flex-1 bg-gradient-to-r from-transparent to-slate-600"></div>
                                <h2 class="text-4xl md:text-5xl font-black bg-gradient-to-r ${titleColor} bg-clip-text text-transparent text-center drop-shadow-md">
                                    Category ${catLetter}
                                </h2>
                                <div class="h-[2px] flex-1 bg-gradient-to-l from-transparent to-slate-600"></div>
                            </div>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">
                        `;

                        // Uss category ke andar 10 Jamiaat ke boxes
                        chunk.forEach((jamia, index) => {
                            let globalRank = i + index + 1;
                            html += `
                                <div class="relative bg-slate-800/80 border ${borderColor} ${shadowClass} rounded-2xl p-6 flex flex-col items-center text-center transform transition duration-300 hover:scale-105 hover:bg-slate-800">
                                    <div class="absolute -top-3 -left-3 bg-slate-900 border ${borderColor} w-10 h-10 rounded-full flex items-center justify-center font-bold text-white shadow-lg">
                                        #${globalRank}
                                    </div>
                                    <h3 class="text-lg md:text-xl font-bold text-white mb-3 line-clamp-2 min-h-[56px] flex items-center justify-center w-full">
                                        ${jamia.name}
                                    </h3>
                                    <div class="mt-auto">
                                        <p class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-1">Entry Units</p>
                                        <div class="text-3xl md:text-4xl font-black ${numberColor} drop-shadow-lg">
                                            ${formatNum(jamia.amount)}
                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                        html += `</div></div>`; // Close grid and category wrapper
                        container.innerHTML += html;
                    }
                }
            }
        });
    }
</script>
</body>
</html>
