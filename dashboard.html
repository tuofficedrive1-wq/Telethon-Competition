<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        
        /* Animated Progress Bar */
        .progress-striped {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.2) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0.2) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
            animation: progress-move 1s linear infinite;
        }
        @keyframes progress-move { 0% { background-position: 1rem 0; } 100% { background-position: 0 0; } }

        /* Card Hover Effects */
        .rank-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .rank-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- SELECTION SCREEN -->
    <div id="selection-screen" class="hidden flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-3xl font-black mb-8 text-indigo-900">Select Competition</h1>
        <div id="comp-list" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-5xl">
            <!-- List loads here -->
        </div>
    </div>

    <!-- MAIN LIVE DASHBOARD -->
    <div id="live-dashboard" class="hidden flex-col min-h-screen p-6 md:p-12 max-w-7xl mx-auto">
        
        <!-- Header -->
        <div class="flex justify-between items-end mb-10 border-b-2 border-gray-200 pb-4">
            <div>
                <div class="text-red-500 font-bold tracking-widest uppercase text-sm mb-1 animate-pulse">🔴 Live Broadcast</div>
                <h1 id="dash-title" class="text-4xl md:text-5xl font-black text-slate-900 uppercase tracking-tight">Competition Name</h1>
            </div>
            <div class="text-right hidden md:block">
                <div class="text-sm font-bold text-gray-400 uppercase">Target (Hadaf)</div>
                <div id="global-target" class="text-2xl font-black text-indigo-600">0</div>
            </div>
        </div>

        <!-- DYNAMIC TEAMS CONTAINER -->
        <div id="leaderboard-container" class="w-full">
            <!-- JS will generate cards here -->
        </div>

    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // ✅ APNA FIREBASE CONFIG YAHAN DAALEIN
    const firebaseConfig = {
        apiKey: "AIzaSyC87_ca7MsGB2WjOnr6dC-IYL78TYx0Oyg",
        authDomain: "telethon-28c88.firebaseapp.com",
        databaseURL: "https://telethon-28c88-default-rtdb.firebaseio.com",
        projectId: "telethon-28c88",
        storageBucket: "telethon-28c88.firebasestorage.app",
        messagingSenderId: "609452116316",
        appId: "1:609452116316:web:e940fc5dc4537b34551999"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const currentCompId = urlParams.get('id');

    function formatNum(num) {
        return Number(num).toLocaleString('en-IN', { maximumFractionDigits: 1 });
    }

    if (!currentCompId) {
        document.getElementById('selection-screen').classList.remove('hidden');
        document.getElementById('selection-screen').classList.add('flex');
        
        onValue(ref(db, 'competitions'), (snapshot) => {
            const list = document.getElementById('comp-list');
            list.innerHTML = "";
            if (snapshot.exists()) {
                const comps = snapshot.val();
                for (let id in comps) {
                    list.innerHTML += `
                        <a href="?id=${id}" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-500 hover:shadow-lg transition block">
                            <h2 class="text-2xl font-bold text-slate-800">${comps[id].name}</h2>
                            <p class="text-gray-500 mt-2 text-sm">Teams: ${comps[id].teams ? Object.keys(comps[id].teams).length : 0}</p>
                            <div class="mt-5 inline-block bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg font-bold text-sm">Launch Dashboard &rarr;</div>
                        </a>
                    `;
                }
            } else {
                list.innerHTML = "<p>No active competitions found.</p>";
            }
        });
    } else {
        document.getElementById('live-dashboard').classList.remove('hidden');
        document.getElementById('live-dashboard').classList.add('flex');

        onValue(ref(db, 'competitions/' + currentCompId), (snapshot) => {
            if (snapshot.exists()) {
                const comp = snapshot.val();
                document.getElementById('dash-title').innerText = comp.name;

                if (comp.teams) {
                    let teamsArray = Object.keys(comp.teams).map(k => comp.teams[k]);
                    teamsArray.sort((a, b) => (Number(b.amount) || 0) - (Number(a.amount) || 0));

                    // Calculate Global Target
                    let highestScore = Number(teamsArray[0].amount) || 0;
                    let dynamicTarget = Math.ceil((highestScore + 1) / 1000) * 1000;
                    if(dynamicTarget < 2000) dynamicTarget = 2000;
                    document.getElementById('global-target').innerText = "₹ " + formatNum(dynamicTarget);

                    let topCardHtml = '';
                    let gridCardsHtml = '';

                    teamsArray.forEach((t, index) => {
                        let rank = index + 1;
                        let amt = Number(t.amount) || 0;
                        let pct = Math.min(((amt / dynamicTarget) * 100), 100).toFixed(1);
                        
                        // Theme Styling based on Rank
                        let bgClass, borderClass, textHighlight, barClass, badgeText, badgeBg;

                        if(rank === 1 && amt > 0) {
                            bgClass = "bg-gradient-to-br from-yellow-50 to-amber-100";
                            borderClass = "border-yellow-400";
                            textHighlight = "text-amber-600";
                            barClass = "bg-gradient-to-r from-yellow-400 to-orange-500";
                            badgeText = "👑 RANK #1 - LEADER";
                            badgeBg = "bg-amber-200 text-amber-800";
                        } else if(rank === 2 && amt > 0) {
                            bgClass = "bg-gradient-to-br from-slate-50 to-gray-200";
                            borderClass = "border-gray-400";
                            textHighlight = "text-gray-600";
                            barClass = "bg-gradient-to-r from-gray-400 to-slate-500";
                            badgeText = "🥈 RANK #2";
                            badgeBg = "bg-gray-300 text-gray-800";
                        } else if(rank === 3 && amt > 0) {
                            bgClass = "bg-gradient-to-br from-orange-50 to-orange-100";
                            borderClass = "border-orange-300";
                            textHighlight = "text-orange-700";
                            barClass = "bg-gradient-to-r from-orange-400 to-red-400";
                            badgeText = "🥉 RANK #3";
                            badgeBg = "bg-orange-200 text-orange-800";
                        } else {
                            bgClass = "bg-white";
                            borderClass = "border-gray-200";
                            textHighlight = "text-indigo-600";
                            barClass = "bg-indigo-500";
                            badgeText = "RANK #" + rank;
                            badgeBg = "bg-gray-100 text-gray-500";
                        }

                        // Top Team Card (Big Full Width)
                        if (rank === 1) {
                            topCardHtml = `
                                <div class="rank-card w-full ${bgClass} border-2 ${borderClass} rounded-3xl p-6 md:p-10 mb-8 shadow-lg flex flex-col md:flex-row justify-between items-center gap-6">
                                    <div class="flex-1 w-full text-center md:text-left">
                                        <span class="${badgeBg} px-4 py-1 rounded-full text-xs font-black tracking-widest uppercase shadow-sm">${badgeText}</span>
                                        <h2 class="text-4xl md:text-6xl font-black text-slate-900 mt-4 leading-tight">${t.name}</h2>
                                    </div>
                                    <div class="flex-1 w-full text-center md:text-right">
                                        <div class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Total Collection</div>
                                        <div class="text-6xl md:text-8xl font-black ${textHighlight} leading-none tracking-tighter">₹${formatNum(amt)}</div>
                                        
                                        <div class="mt-6 w-full md:w-3/4 ml-auto">
                                            <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                                                <span>Progress</span><span>${pct}%</span>
                                            </div>
                                            <div class="h-4 w-full bg-white/50 rounded-full overflow-hidden border border-white">
                                                <div class="h-full ${barClass} progress-striped rounded-full" style="width: ${pct}%;"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        } 
                        // Other Teams (Grid Layout)
                        else {
                            gridCardsHtml += `
                                <div class="rank-card ${bgClass} border-2 ${borderClass} rounded-2xl p-6 shadow-sm flex flex-col justify-between">
                                    <div>
                                        <span class="${badgeBg} px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase">${badgeText}</span>
                                        <h3 class="text-2xl md:text-3xl font-black text-slate-800 mt-4 leading-tight">${t.name}</h3>
                                    </div>
                                    <div class="mt-6">
                                        <div class="text-4xl md:text-5xl font-black ${textHighlight} tracking-tighter mb-4">₹${formatNum(amt)}</div>
                                        <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                                            <span>Progress</span><span>${pct}%</span>
                                        </div>
                                        <div class="h-3 w-full bg-black/5 rounded-full overflow-hidden">
                                            <div class="h-full ${barClass} progress-striped rounded-full" style="width: ${pct}%;"></div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    });

                    // Combine HTML
                    let finalHtml = topCardHtml;
                    if(gridCardsHtml !== '') {
                        finalHtml += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${gridCardsHtml}</div>`;
                    }
                    
                    document.getElementById('leaderboard-container').innerHTML = finalHtml;
                }
            }
        });
    }
</script>
</body>
</html>
