<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jamiaat Live Entry System</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f7fb; min-height: 100vh; padding: 20px; }
    .screen { display: none; max-width: 1100px; margin: auto; }
    .active-screen { display: block; }
    
    /* Global Styles */
    .card { background: #fff; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,.08); }
    .topbar { background: #fff; padding: 18px 22px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,.08); }
    h2, h3 { margin-bottom: 15px; color: #333; }
    label { display: block; font-weight: bold; margin: 12px 0 6px; font-size: 14px; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: #1769aa; color: white; font-size: 16px; cursor: pointer; transition: 0.3s; }
    button:hover { background: #0d568e; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #c82333; }
    .btn-success { background: #198754; width: 100%; margin-top: 15px;}
    .btn-success:hover { background: #157347; }
    .btn-secondary { background: #6c757d; }
    .text-center { text-align: center; }
    .mt-3 { margin-top: 15px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }

    /* Login Screen */
    #login-screen { max-width: 400px; margin: 80px auto; }

    /* Admin Grids & Lists */
    .comp-list-item { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
    .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
    .team-box { background: #f8f9fa; padding: 18px; border-radius: 10px; position: relative; border: 1px solid #ddd; }
    .remove-team { position: absolute; top: 10px; right: 10px; background: #dc3545; padding: 5px 10px; font-size: 12px; }

    /* Live Dashboards */
    .live-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-top: 20px; }
    .live-box { text-align: center; padding: 25px 15px; border-radius: 10px; background: #f8f9fa; border: 2px solid #eee; }
    .live-name { font-size: 20px; font-weight: bold; }
    .live-amount { font-size: 32px; font-weight: bold; margin: 15px 0; color: #198754; }

    /* Team Interface */
    .huge-amount { font-size: 40px; font-weight: bold; text-align: center; margin: 15px 0; color: #1769aa; }
    .search-box { padding: 15px; font-size: 16px; border: 2px solid #1769aa; border-radius: 8px; width: 100%; margin-bottom: 20px; outline: none;}
</style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="screen active-screen">
        <div class="card">
            <h2 class="text-center">System Login</h2>
            <div class="text-center" style="color:#777; margin-bottom: 20px;">Admin ya User ID daalein</div>
            <label>Login ID</label>
            <input id="loginId" type="text" placeholder="Enter ID">
            <label>Password</label>
            <input id="loginPass" type="password" placeholder="Enter Password">
            <button id="loginBtn" style="width: 100%; margin-top: 20px;">Login</button>
            <div id="loginMessage" class="text-center mt-3"></div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dash-screen" class="screen">
        <div class="topbar">
            <h2>Admin Dashboard</h2>
            <button class="btn-danger logoutBtn">Logout</button>
        </div>
        <div class="card">
            <div class="flex-between">
                <h3>All Records</h3>
                <button id="createNewCompBtn" class="btn-success" style="width:auto; margin:0;">+ Create New Record</button>
            </div>
            <div id="competitionsList" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- Admin Edit Screen -->
    <div id="admin-edit-screen" class="screen">
        <div class="topbar">
            <h2>Jamiaat Setup</h2>
            <button class="btn-secondary" id="backToAdminDashBtn">Back to Dashboard</button>
        </div>
        <div class="card">
            <label>Record Name (e.g., Ramzan Collection 2026)</label>
            <input id="compName" type="text" placeholder="Enter Name">
            <label>Date</label>
            <input id="compDate" type="date">
            
            <h3 style="margin-top: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px;">Jamiaat List</h3>
            <p style="font-size: 13px; color: #666; margin-top: 5px;">Ek User ko bohot saari Jamiaat assign karne ke liye, un sabka <b>Login ID</b> aur <b>Password</b> same rakhein.</p>
            <div id="teamInputsContainer" class="teams-grid"></div>
            
            <button id="addTeamBtn" class="btn-secondary mt-3">+ Add Another Jamia</button>
            
            <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ddd;">
            <button id="saveCompBtn" class="btn-success">Save Record</button>
            <div id="saveStatus" class="text-center mt-3 font-weight-bold"></div>
        </div>
    </div>

    <!-- User/Team Screen -->
    <div id="team-screen" class="screen">
        <div class="topbar">
            <div>
                <h2>My Assigned Jamiaat</h2>
                <div id="teamUiCompName" style="color:#666;">-</div>
            </div>
            <button class="btn-danger logoutBtn">Logout</button>
        </div>
        
        <div class="card">
            <h3>Jamia Search Karein</h3>
            <!-- SEARCH BOX FOR QUICK ENTRY -->
            <input type="text" id="jamiaSearchBox" class="search-box" placeholder="🔍 Jamia ka naam likhein...">
            
            <div id="teamUpdateFormsContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;">
                <!-- User Forms Load Here -->
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, get, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // ✅ FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyC87_ca7MsGB2WjOnr6dC-IYL78TYx0Oyg",
        authDomain: "telethon-28c88.firebaseapp.com",
        databaseURL: "https://telethon-28c88-default-rtdb.firebaseio.com",
        projectId: "telethon-28c88",
        storageBucket: "telethon-28c88.firebasestorage.app",
        messagingSenderId: "609452116316",
        appId: "1:609452116316:web:e940fc5dc4537b34551999"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentRole = localStorage.getItem('userRole') || null;
    let managedTeams = JSON.parse(localStorage.getItem('managedTeams')) || []; 
    let activeAdminCompId = null; 
    let editingCompId = null;
    let globalCompetitions = {}; 

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }

    if (currentRole === 'admin') { switchScreen('admin-dash-screen'); } 
    else if (currentRole === 'team' && managedTeams.length > 0) { switchScreen('team-screen'); }

    document.querySelectorAll('.logoutBtn').forEach(btn => {
        btn.addEventListener('click', () => {
            localStorage.clear(); currentRole = null; managedTeams = []; switchScreen('login-screen');
        });
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const id = document.getElementById('loginId').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        const msg = document.getElementById('loginMessage');
        
        if(!id || !pass) { msg.innerHTML = "<span style='color:red'>ID & Password required</span>"; return; }
        msg.innerHTML = "<span style='color:blue'>Verifying...</span>";

        if(id === 'admin' && pass === 'admin123') {
            localStorage.setItem('userRole', 'admin'); currentRole = 'admin'; msg.innerText = ""; switchScreen('admin-dash-screen'); return;
        }

        try {
            const snap = await get(ref(db, 'competitions'));
            if(snap.exists()){
                const comps = snap.val();
                let foundTeams = [];
                for(let cId in comps) {
                    if(comps[cId].teams) {
                        for(let tId in comps[cId].teams) {
                            let t = comps[cId].teams[tId];
                            if(t.loginId === id && t.password === pass) {
                                foundTeams.push({ compId: cId, teamId: tId });
                            }
                        }
                    }
                }
                if(foundTeams.length > 0) {
                    localStorage.setItem('userRole', 'team'); localStorage.setItem('managedTeams', JSON.stringify(foundTeams));
                    currentRole = 'team'; managedTeams = foundTeams; msg.innerText = ""; switchScreen('team-screen');
                } else { msg.innerHTML = "<span style='color:red'>Invalid ID/Password!</span>"; }
            } else { msg.innerHTML = "<span style='color:red'>No data found!</span>"; }
        } catch(e) { msg.innerHTML = "<span style='color:red'>Error connecting to DB</span>"; }
    });

    onValue(ref(db, 'competitions'), (snapshot) => {
        globalCompetitions = snapshot.exists() ? snapshot.val() : {};
        if (currentRole === 'admin' && document.getElementById('admin-dash-screen').classList.contains('active-screen')) { renderAdminDashboard(); }
        if (currentRole === 'team' && managedTeams.length > 0 && document.getElementById('team-screen').classList.contains('active-screen')) { renderTeamScreen(); }
    });

    function renderAdminDashboard() {
        const list = document.getElementById('competitionsList'); list.innerHTML = ""; let hasComps = false;
        for(let cId in globalCompetitions) {
            hasComps = true; const comp = globalCompetitions[cId];
            const div = document.createElement('div'); div.className = "comp-list-item";
            div.innerHTML = `
                <div><h3 style="margin-bottom:5px;">${comp.name}</h3><div style="font-size:14px; color:#666;">Date: ${comp.date || 'N/A'} | Jamiaat: ${comp.teams ? Object.keys(comp.teams).length : 0}</div></div>
                <div>
                    <button class="btn-secondary editCompBtn" data-id="${cId}" style="margin-right:10px;">Edit Jamiaat</button>
                    <button class="btn-danger deleteCompBtn" data-id="${cId}">Delete</button>
                </div>
            `;
            list.appendChild(div);
        }
        if(!hasComps) list.innerHTML = "<p>No records yet.</p>";

        document.querySelectorAll('.editCompBtn').forEach(btn => btn.onclick = (e) => { openEditor(e.target.getAttribute('data-id')); });
        document.querySelectorAll('.deleteCompBtn').forEach(btn => btn.onclick = async (e) => {
            if(confirm("Delete this record?")) { await remove(ref(db, 'competitions/' + e.target.getAttribute('data-id'))); }
        });
    }

    document.getElementById('createNewCompBtn').onclick = () => { openEditor(null); };
    document.getElementById('backToAdminDashBtn').onclick = () => { switchScreen('admin-dash-screen'); renderAdminDashboard(); };

    function openEditor(compId) {
        editingCompId = compId || "comp_" + Date.now();
        document.getElementById('teamInputsContainer').innerHTML = "";
        document.getElementById('saveStatus').innerText = "";

        if(compId && globalCompetitions[compId]) {
            const comp = globalCompetitions[compId];
            document.getElementById('compName').value = comp.name; document.getElementById('compDate').value = comp.date;
            if(comp.teams) { for(let tId in comp.teams) { appendTeamInputUI(tId, comp.teams[tId].name, comp.teams[tId].loginId || tId, comp.teams[tId].password, comp.teams[tId].amount); } }
        } else {
            document.getElementById('compName').value = ""; document.getElementById('compDate').value = "";
            appendTeamInputUI(); appendTeamInputUI();
        }
        switchScreen('admin-edit-screen');
    }

    document.getElementById('addTeamBtn').onclick = () => { appendTeamInputUI(); };

    function appendTeamInputUI(tId = "", tName = "", tLoginId = "", tPass = "", tAmount = 0) {
        const div = document.createElement('div'); div.className = "team-box team-entry"; div.dataset.amount = tAmount; 
        const uid = tId || "team_" + Math.floor(Math.random() * 100000); div.dataset.teamId = uid;
        
        div.innerHTML = `
            <button class="remove-team text-white border-0 cursor-pointer" onclick="this.parentElement.remove()">X</button>
            <label>Jamia Name</label>
            <input type="text" class="t-name" value="${tName}" placeholder="Jamia Name">
            <label>User Login ID</label>
            <input type="text" class="t-login-id" value="${tLoginId}" placeholder="User ID">
            <label>User Password</label>
            <input type="text" class="t-pass" value="${tPass}" placeholder="Password">
        `;
        document.getElementById('teamInputsContainer').appendChild(div);
    }

    document.getElementById('saveCompBtn').onclick = async () => {
        const compName = document.getElementById('compName').value || "Unnamed Record";
        const compDate = document.getElementById('compDate').value;
        const status = document.getElementById('saveStatus');
        
        let teamsData = {};
        document.querySelectorAll('.team-entry').forEach(el => {
            const id = el.dataset.teamId;
            teamsData[id] = { name: el.querySelector('.t-name').value || "Unnamed", loginId: el.querySelector('.t-login-id').value || id, password: el.querySelector('.t-pass').value || "1234", amount: Number(el.dataset.amount) || 0 };
        });

        status.innerHTML = "<span style='color:blue'>Saving...</span>";
        try {
            await set(ref(db, 'competitions/' + editingCompId), { name: compName, date: compDate, teams: teamsData });
            status.innerHTML = "<span style='color:green'>Saved Successfully!</span>";
            setTimeout(() => { switchScreen('admin-dash-screen'); renderAdminDashboard(); }, 1000);
        } catch(e) { status.innerHTML = "<span style='color:red'>Error saving data</span>"; }
    };

    function renderTeamScreen() {
        if(!managedTeams || managedTeams.length === 0) return;
        let mainCompId = managedTeams[0].compId; const comp = globalCompetitions[mainCompId];
        if(!comp) return;

        document.getElementById('teamUiCompName').innerText = comp.name;
        const container = document.getElementById('teamUpdateFormsContainer');
        let formsHtml = "";

        managedTeams.forEach(mt => {
            const c = globalCompetitions[mt.compId];
            if(c && c.teams && c.teams[mt.teamId]) {
                const t = c.teams[mt.teamId];
                // Added jamia-card class and data-name for searching
                formsHtml += `
                    <div class="jamia-card" data-name="${t.name.toLowerCase()}" style="background:#f8f9fa; padding:20px; border-radius:8px; border:2px solid #eee;">
                        <h4 style="color:#1769aa; font-size:18px; text-align:center;">${t.name}</h4>
                        <div class="huge-amount" id="amt_${mt.teamId}">₹${t.amount}</div>
                        <input id="input_${mt.teamId}" type="number" min="0" placeholder="New Total Entry..." style="margin-bottom:10px;">
                        <button class="btn-success" onclick="updateTeamAmount('${mt.compId}', '${mt.teamId}')">Update Entry</button>
                    </div>
                `;
            }
        });
        container.innerHTML = formsHtml;
    }

    // SEARCH FUNCTIONALITY FOR USER
    document.getElementById('jamiaSearchBox').addEventListener('input', function(e) {
        let searchValue = e.target.value.toLowerCase();
        document.querySelectorAll('.jamia-card').forEach(card => {
            let name = card.getAttribute('data-name');
            if(name.includes(searchValue)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    });

    window.updateTeamAmount = async (cId, tId) => {
        const input = document.getElementById('input_' + tId);
        const newAmt = Number(input.value);
        if(input.value === "" || newAmt < 0) { alert("Sahi entry daalein"); return; }
        document.getElementById('amt_' + tId).innerText = "₹" + newAmt;
        try {
            await update(ref(db, `competitions/${cId}/teams/${tId}`), { amount: newAmt });
            input.value = "";
        } catch(e) { alert("Update failed."); }
    };
</script>
</body>
</html>
