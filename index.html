<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Competition System</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f7fb; min-height: 100vh; padding: 20px; }
    .screen { display: none; max-width: 1100px; margin: auto; }
    .active-screen { display: block; }
    
    /* Global Styles */
    .card { background: #fff; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,.08); }
    .topbar { background: #fff; padding: 18px 22px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,.08); }
    h2, h3, h4 { margin-bottom: 15px; color: #333; }
    label { display: block; font-weight: bold; margin: 12px 0 6px; font-size: 14px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: #1769aa; color: white; font-size: 16px; cursor: pointer; transition: 0.3s; }
    button:hover { background: #0d568e; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #c82333; }
    .btn-success { background: #198754; width: 100%; margin-top: 15px;}
    .btn-success:hover { background: #157347; }
    .btn-secondary { background: #6c757d; }
    .text-center { text-align: center; }
    .mt-3 { margin-top: 15px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    /* Login & Teams */
    #login-screen { max-width: 400px; margin: 80px auto; }
    .comp-list-item { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
    .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
    .team-box { background: #f8f9fa; padding: 18px; border-radius: 10px; position: relative; border: 1px solid #ddd; }
    .remove-team { position: absolute; top: 10px; right: 10px; background: #dc3545; padding: 5px 10px; font-size: 12px; }

    /* Live Dashboards */
    .live-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-top: 20px; }
    .live-box { text-align: center; padding: 25px 15px; border-radius: 10px; background: #f8f9fa; border: 2px solid #eee; }
    .live-box.winner-box { border-color: #ffc107; background: #fffbe6; }
    .live-name { font-size: 20px; font-weight: bold; }
    .live-amount { font-size: 32px; font-weight: bold; margin: 15px 0; color: #198754; }
    .winner-text { text-align: center; font-size: 28px; font-weight: bold; margin-top: 25px; color: #d00; }
    .huge-amount { font-size: 50px; font-weight: bold; text-align: center; margin: 20px 0; color: #1769aa; }
</style>
</head>
<body>

    <div id="login-screen" class="screen active-screen">
        <div class="card">
            <h2 class="text-center">Competition Login</h2>
            <div class="text-center" style="color:#777; margin-bottom: 20px;">Admin ya Team ID daalein</div>
            <label>Login ID</label>
            <input id="loginId" type="text" placeholder="Enter ID (Admin/Team)">
            <label>Password</label>
            <input id="loginPass" type="password" placeholder="Enter Password">
            <button id="loginBtn" style="width: 100%; margin-top: 20px;">Login</button>
            <div id="loginMessage" class="text-center mt-3"></div>
        </div>
    </div>

    <div id="admin-dash-screen" class="screen">
        <div class="topbar">
            <h2>Admin Dashboard</h2>
            <button class="btn-danger logoutBtn">Logout</button>
        </div>
        <div class="card">
            <div class="flex-between">
                <h3>All Competitions</h3>
                <button id="createNewCompBtn" class="btn-success" style="width:auto; margin:0;">+ Create New Competition</button>
            </div>
            <div id="competitionsList" style="margin-top: 20px;"></div>
        </div>
    </div>

    <div id="admin-edit-screen" class="screen">
        <div class="topbar">
            <h2>Competition Setup</h2>
            <button class="btn-secondary" id="backToAdminDashBtn">Back to Dashboard</button>
        </div>
        <div class="card">
            <label>Competition Name</label>
            <input id="compName" type="text" placeholder="E.g. Grand Finale 2026">
            
            <h3 style="margin-top: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px;">Dashboard & Time Settings</h3>
            <div class="settings-grid">
                <div>
                    <label>Dashboard View Type</label>
                    <select id="dashViewType">
                        <option value="versus">Versus (Top 2 Focus)</option>
                        <option value="category">Category Wise List</option>
                    </select>
                </div>
                <div>
                    <label>End Date & Time</label>
                    <input id="compEndTime" type="datetime-local">
                </div>
                <div>
                    <label>Result Delay (Minutes)</label>
                    <input id="compDelay" type="number" placeholder="E.g. 5 (Minutes after end time)">
                </div>
            </div>

            <h4 style="margin-top: 20px;">Category Minimum Targets (For Category View)</h4>
            <div class="settings-grid">
                <div><label>Category A Minimum</label><input id="catA" type="number" value="10000"></div>
                <div><label>Category B Minimum</label><input id="catB" type="number" value="5000"></div>
                <div><label>Category C Minimum</label><input id="catC" type="number" value="2000"></div>
                <div><label>Category D Minimum</label><input id="catD" type="number" value="0"></div>
            </div>
            
            <h3 style="margin-top: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px;">Teams</h3>
            <div id="teamInputsContainer" class="teams-grid"></div>
            
            <button id="addTeamBtn" class="btn-secondary mt-3">+ Add Another Team</button>
            
            <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ddd;">
            <button id="saveCompBtn" class="btn-success">Save Competition</button>
            <div id="saveStatus" class="text-center mt-3 font-weight-bold"></div>
        </div>
    </div>

    <div id="admin-live-screen" class="screen">
        <div class="topbar">
            <h2 id="liveCompTitle">Live Dashboard</h2>
            <button class="btn-secondary" id="backToDashFromLiveBtn">Back</button>
        </div>
        <div class="card">
            <div id="adminLiveTeamsContainer" class="live-teams"></div>
            <div class="winner-text" id="adminLiveWinner">Winner: -</div>
        </div>
    </div>

    <div id="team-screen" class="screen">
        <div class="topbar">
            <div>
                <h2 id="teamUiName">Team Name</h2>
                <div id="teamUiCompName" style="color:#666;">-</div>
            </div>
            <button class="btn-danger logoutBtn">Logout</button>
        </div>
        
        <div class="card">
            <h3>Update Your Collection</h3>
            <div class="huge-amount" id="teamUiMyAmount">₹0</div>
            <input id="teamInputAmount" type="number" min="0" placeholder="Enter total amount here">
            <button class="btn-success" id="teamUpdateBtn">Update My Amount</button>
        </div>

        <div class="card">
            <h3>Live Leaderboard</h3>
            <div id="teamLiveContainer" class="live-teams"></div>
            <div class="winner-text" id="teamLiveWinner">-</div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, get, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // APNA FIREBASE CONFIG YAHAN DAALEIN
    const firebaseConfig = {
        apiKey: "AIzaSyC87_ca7MsGB2WjOnr6dC-IYL78TYx0Oyg",
        authDomain: "telethon-28c88.firebaseapp.com",
        databaseURL: "https://telethon-28c88-default-rtdb.firebaseio.com",
        projectId: "telethon-28c88",
        storageBucket: "telethon-28c88.firebasestorage.app",
        messagingSenderId: "609452116316",
        appId: "1:609452116316:web:e940fc5dc4537b34551999"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentRole = localStorage.getItem('userRole') || null;
    let myCompId = localStorage.getItem('myCompId') || null;
    let myTeamId = localStorage.getItem('myTeamId') || null;
    let activeAdminCompId = null; 
    let editingCompId = null;
    let globalCompetitions = {}; 

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }

    if (currentRole === 'admin') { switchScreen('admin-dash-screen'); } 
    else if (currentRole === 'team' && myCompId && myTeamId) { switchScreen('team-screen'); }

    document.querySelectorAll('.logoutBtn').forEach(btn => {
        btn.addEventListener('click', () => {
            localStorage.clear();
            currentRole = null; myCompId = null; myTeamId = null;
            switchScreen('login-screen');
        });
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const id = document.getElementById('loginId').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        const msg = document.getElementById('loginMessage');
        
        if(!id || !pass) { msg.innerHTML = "<span style='color:red'>ID and Password required</span>"; return; }
        msg.innerHTML = "<span style='color:blue'>Verifying...</span>";

        if(id === 'admin' && pass === 'admin123') {
            localStorage.setItem('userRole', 'admin');
            currentRole = 'admin'; msg.innerText = "";
            switchScreen('admin-dash-screen'); return;
        }

        try {
            const snap = await get(ref(db, 'competitions'));
            if(snap.exists()){
                const comps = snap.val();
                let found = false;
                for(let cId in comps) {
                    if(comps[cId].teams && comps[cId].teams[id] && comps[cId].teams[id].password === pass) {
                        localStorage.setItem('userRole', 'team');
                        localStorage.setItem('myCompId', cId); localStorage.setItem('myTeamId', id);
                        currentRole = 'team'; myCompId = cId; myTeamId = id; found = true;
                        msg.innerText = ""; switchScreen('team-screen'); break;
                    }
                }
                if(!found) msg.innerHTML = "<span style='color:red'>Invalid Team ID or Password!</span>";
            } else { msg.innerHTML = "<span style='color:red'>No competitions found!</span>"; }
        } catch(e) { msg.innerHTML = "<span style='color:red'>Error connecting to database</span>"; }
    });

    onValue(ref(db, 'competitions'), (snapshot) => {
        globalCompetitions = snapshot.exists() ? snapshot.val() : {};
        if (currentRole === 'admin' && document.getElementById('admin-dash-screen').classList.contains('active-screen')) renderAdminDashboard();
        if (currentRole === 'admin' && activeAdminCompId && document.getElementById('admin-live-screen').classList.contains('active-screen')) renderAdminLiveView();
        if (currentRole === 'team' && myCompId && myTeamId && document.getElementById('team-screen').classList.contains('active-screen')) renderTeamScreen();
    });

    function renderAdminDashboard() {
        const list = document.getElementById('competitionsList');
        list.innerHTML = ""; let hasComps = false;

        for(let cId in globalCompetitions) {
            hasComps = true; const comp = globalCompetitions[cId];
            const div = document.createElement('div'); div.className = "comp-list-item";
            div.innerHTML = `
                <div>
                    <h3 style="margin-bottom:5px;">${comp.name}</h3>
                    <div style="font-size:14px; color:#666;">Teams: ${comp.teams ? Object.keys(comp.teams).length : 0} | View: ${comp.settings?.viewType || 'versus'}</div>
                </div>
                <div>
                    <button class="btn-success viewLiveBtn" data-id="${cId}" style="margin-right:10px;">Live View</button>
                    <button class="btn-secondary editCompBtn" data-id="${cId}" style="margin-right:10px;">Edit</button>
                    <button class="btn-danger deleteCompBtn" data-id="${cId}">Delete</button>
                </div>`;
            list.appendChild(div);
        }
        if(!hasComps) list.innerHTML = "<p>No competitions yet. Create one!</p>";

        document.querySelectorAll('.viewLiveBtn').forEach(btn => btn.onclick = (e) => { activeAdminCompId = e.target.getAttribute('data-id'); switchScreen('admin-live-screen'); renderAdminLiveView(); });
        document.querySelectorAll('.editCompBtn').forEach(btn => btn.onclick = (e) => { openEditor(e.target.getAttribute('data-id')); });
        document.querySelectorAll('.deleteCompBtn').forEach(btn => btn.onclick = async (e) => {
            if(confirm("Are you sure you want to delete this competition?")) await remove(ref(db, 'competitions/' + e.target.getAttribute('data-id')));
        });
    }

    document.getElementById('createNewCompBtn').onclick = () => { openEditor(null); };
    document.getElementById('backToAdminDashBtn').onclick = () => { switchScreen('admin-dash-screen'); renderAdminDashboard(); };
    document.getElementById('backToDashFromLiveBtn').onclick = () => { activeAdminCompId = null; switchScreen('admin-dash-screen'); renderAdminDashboard(); };

    function openEditor(compId) {
        editingCompId = compId || "comp_" + Date.now();
        document.getElementById('teamInputsContainer').innerHTML = "";
        document.getElementById('saveStatus').innerText = "";

        if(compId && globalCompetitions[compId]) {
            const comp = globalCompetitions[compId];
            document.getElementById('compName').value = comp.name || "";
            document.getElementById('dashViewType').value = comp.settings?.viewType || "versus";
            document.getElementById('compEndTime').value = comp.settings?.endTime || "";
            document.getElementById('compDelay').value = comp.settings?.delayMin || 0;
            document.getElementById('catA').value = comp.settings?.catA || 10000;
            document.getElementById('catB').value = comp.settings?.catB || 5000;
            document.getElementById('catC').value = comp.settings?.catC || 2000;
            document.getElementById('catD').value = comp.settings?.catD || 0;

            if(comp.teams) {
                for(let tId in comp.teams) appendTeamInputUI(tId, comp.teams[tId].name, comp.teams[tId].password, comp.teams[tId].amount);
            }
        } else {
            document.getElementById('compName').value = "";
            document.getElementById('dashViewType').value = "versus";
            document.getElementById('compEndTime').value = "";
            document.getElementById('compDelay').value = 0;
            document.getElementById('catA').value = 10000;
            document.getElementById('catB').value = 5000;
            document.getElementById('catC').value = 2000;
            document.getElementById('catD').value = 0;
            appendTeamInputUI(); appendTeamInputUI();
        }
        switchScreen('admin-edit-screen');
    }

    document.getElementById('addTeamBtn').onclick = () => { appendTeamInputUI(); };

    function appendTeamInputUI(tId = "", tName = "", tPass = "", tAmount = 0) {
        const div = document.createElement('div');
        div.className = "team-box team-entry"; div.dataset.amount = tAmount; 
        const uid = tId || "team_" + Math.floor(Math.random() * 100000); 
        div.innerHTML = `
            <button class="remove-team text-white border-0 cursor-pointer" onclick="this.parentElement.remove()">X Remove</button>
            <label>Team Name</label><input type="text" class="t-name" value="${tName}" placeholder="Enter Team Name">
            <label>Login ID</label><input type="text" class="t-id" value="${uid}" readonly style="background:#eee;">
            <label>Password</label><input type="text" class="t-pass" value="${tPass}" placeholder="Enter Password">
        `;
        document.getElementById('teamInputsContainer').appendChild(div);
    }

    document.getElementById('saveCompBtn').onclick = async () => {
        const status = document.getElementById('saveStatus');
        let teamsData = {};
        document.querySelectorAll('.team-entry').forEach(el => {
            const id = el.querySelector('.t-id').value;
            teamsData[id] = { name: el.querySelector('.t-name').value || "Unnamed", password: el.querySelector('.t-pass').value || "1234", amount: Number(el.dataset.amount) || 0 };
        });

        const settingsData = {
            viewType: document.getElementById('dashViewType').value,
            endTime: document.getElementById('compEndTime').value,
            delayMin: Number(document.getElementById('compDelay').value) || 0,
            catA: Number(document.getElementById('catA').value) || 10000,
            catB: Number(document.getElementById('catB').value) || 5000,
            catC: Number(document.getElementById('catC').value) || 2000,
            catD: Number(document.getElementById('catD').value) || 0
        };

        status.innerHTML = "<span style='color:blue'>Saving...</span>";
        try {
            await set(ref(db, 'competitions/' + editingCompId), { name: document.getElementById('compName').value || "Unnamed", settings: settingsData, teams: teamsData });
            status.innerHTML = "<span style='color:green'>Saved Successfully!</span>";
            setTimeout(() => { switchScreen('admin-dash-screen'); renderAdminDashboard(); }, 1000);
        } catch(e) { status.innerHTML = "<span style='color:red'>Error saving data</span>"; }
    };

    function calculateWinner(teamsObj) {
        if(!teamsObj) return "-";
        let maxAmt = 0; let winnerName = "-"; let tie = false;
        for(let id in teamsObj) {
            let amt = Number(teamsObj[id].amount) || 0;
            if(amt > maxAmt) { maxAmt = amt; winnerName = teamsObj[id].name; tie = false; }
            else if(amt === maxAmt && amt > 0) { tie = true; }
        }
        if(maxAmt === 0) return "Not Started"; return tie ? "Tie / Draw" : winnerName;
    }

    function generateLiveHTML(teamsObj, maxAmtObj) {
        if(!teamsObj) return "<p>No teams</p>";
        let html = "";
        for(let id in teamsObj) {
            const t = teamsObj[id]; const isWinner = (t.amount > 0 && t.amount === maxAmtObj.max);
            html += `<div class="live-box ${isWinner ? 'winner-box' : ''}"><div class="live-name">${t.name}</div><div class="live-amount">₹${t.amount}</div></div>`;
        }
        return html;
    }

    function renderAdminLiveView() {
        const comp = globalCompetitions[activeAdminCompId]; if(!comp) return;
        document.getElementById('liveCompTitle').innerText = comp.name;
        let maxAmt = 0; if(comp.teams) { for(let id in comp.teams) { if(comp.teams[id].amount > maxAmt) maxAmt = comp.teams[id].amount; } }
        document.getElementById('adminLiveTeamsContainer').innerHTML = generateLiveHTML(comp.teams, {max: maxAmt});
        document.getElementById('adminLiveWinner').innerText = "Winner: " + calculateWinner(comp.teams);
    }

    function renderTeamScreen() {
        const comp = globalCompetitions[myCompId];
        if(!comp || !comp.teams || !comp.teams[myTeamId]) { alert("Data removed by Admin."); localStorage.clear(); location.reload(); return; }
        document.getElementById('teamUiName').innerText = comp.teams[myTeamId].name;
        document.getElementById('teamUiCompName').innerText = comp.name;
        document.getElementById('teamUiMyAmount').innerText = "₹" + comp.teams[myTeamId].amount;
        let maxAmt = 0; for(let id in comp.teams) { if(comp.teams[id].amount > maxAmt) maxAmt = comp.teams[id].amount; }
        document.getElementById('teamLiveContainer').innerHTML = generateLiveHTML(comp.teams, {max: maxAmt});
        document.getElementById('teamLiveWinner').innerText = "Current Winner: " + calculateWinner(comp.teams);
    }

    document.getElementById('teamUpdateBtn').onclick = async () => {
        const input = document.getElementById('teamInputAmount'); const newAmt = Number(input.value);
        if(input.value === "" || newAmt < 0) { alert("Enter valid amount"); return; }
        const btn = document.getElementById('teamUpdateBtn'); btn.innerText = "Updating..."; btn.disabled = true;
        document.getElementById('teamUiMyAmount').innerText = "₹" + newAmt;
        try { await update(ref(db, `competitions/${myCompId}/teams/${myTeamId}`), { amount: newAmt }); input.value = ""; } 
        catch(e) { alert("Failed to update"); }
        btn.innerText = "Update My Amount"; btn.disabled = false;
    };
</script>
</body>
</html>
